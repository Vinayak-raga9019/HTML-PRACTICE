<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Captcha form</title>
</head>
<body>
    <h2>captcha form</h2>
    <form>
      <label for="captcha">Enter captcha:</label>
      <input type="text" id="captcha" placeholder="enter captcha..bro" name="captcha">
      <br>
      <br>
      <label for="un">username:</label>
      <input type="text" placeholder="enter username..bro" id="un" name="username">
      <br>
      <br>
      <label>email:</label>
      <input type="email" name="email" placeholder="email de do bhaiya">
      <br>
      <br>
      <label>password: <span style="color: red;">*</span></label>
      <input  type="password" name="pwd" required placeholder="paswrd compulsry bro">
      <br>
      <br>
      <label>phone number:</label>
      <input type="tel">
      <br>
      <br>
      <label>age: </label>
      <input type="number" min="1" max="100">
      <br>
      <br>
      <input type="submit"> &nbsp; &nbsp; &nbsp; &nbsp; 
      <button type="reset">cancel</button>
    </form>
</body>
</html>
